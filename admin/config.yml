backend:
  name: github
  repo: bosskps/aprajita-legal-web
  branch: main
  base_url: https://YOUR-OAUTH-PROXY.vercel.app
  auth_endpoint: auth

# Media Storage Configuration
media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  # Collection: Articles & Case Rulings
  - name: "articles"
    label: "Legal Updates & Articles"
    folder: "content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Author / Advocate Name", name: "author", widget: "string" }
      - { label: "Publication Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Article Body", name: "body", widget: "markdown" }
